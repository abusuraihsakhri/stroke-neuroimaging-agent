name: Python tests and security checks

on:
  push:
    branches: [master, main, 'audit/**']
  pull_request:
    branches: [master, main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project with API and test dependencies
        run: python -m pip install -e ".[api,test]"
      - name: Check dependencies and Python source
        run: |
          python -m pip check
          python -m compileall -q agents stroke_neuroimaging_agent cli.py stroke_sentinel.py enrichment.py simulator.py
      - name: Run regression tests
        env:
          AUDIT_SECRET_KEY: "testing-only-audit-secret-key-never-use-in-production"
        run: python -m pytest -q
      - name: Verify browser JavaScript syntax
        run: |
          node --check web/app.js
          node tests/web_smoke.cjs
