services:
  stroke-neuroimaging-agent:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AUDIT_SECRET_KEY: ${AUDIT_SECRET_KEY:?Set a unique 32+ character secret in your environment}
      MODEL_PROVIDER: mock
      AUDIT_LOGS_API_KEY: ${AUDIT_LOGS_API_KEY:-}
    restart: unless-stopped
